<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSS Run History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f4f6fb; --white:#fff; --border:#e4e9f2; --border2:#d0d9ea;
      --text:#0d1526; --sub:#4b5675; --muted:#8594ae;
      --indigo:#4f46e5; --indigo-lt:#eef2ff;
      --green:#059669; --green-lt:#ecfdf5;
      --red:#dc2626; --red-lt:#fef2f2;
      --amber:#d97706; --amber-lt:#fffbeb;
      --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);
      --r:14px;
    }
    body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; }

    .top-bar { background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#2563eb 100%); padding:30px 32px; position:relative; overflow:hidden; }
    .top-bar-inner { max-width:1080px; margin:0 auto; position:relative; display:flex; align-items:flex-start; justify-content:space-between; }
    .back-link { display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:600; color:rgba(255,255,255,0.85); text-decoration:none; margin-bottom:12px; }
    .back-link:hover { color:#fff; }
    .top-bar h1 { font-size:1.7rem; font-weight:800; color:#fff; letter-spacing:-0.03em; margin-bottom:5px; }
    .top-bar p { font-size:0.86rem; color:rgba(255,255,255,0.65); }

    .container { max-width:1080px; margin:0 auto; padding:28px 24px 0; }

    .toolbar { display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px; margin-bottom:20px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
    .field input, .field select { font-family:inherit; font-size:0.86rem; padding:8px 10px; border:1px solid var(--border2); border-radius:9px; background:var(--white); color:var(--text); min-width:160px; }
    .btn { font-family:inherit; font-size:0.83rem; font-weight:600; padding:9px 16px; border-radius:9px; border:1px solid var(--border2); background:var(--white); color:var(--sub); cursor:pointer; }
    .btn.primary { background:var(--indigo); color:#fff; border-color:var(--indigo); }
    .btn:hover { box-shadow:var(--shadow-sm); }

    .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .stat { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:12px 18px; min-width:120px; box-shadow:var(--shadow-sm); }
    .stat .num { font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; }
    .stat .lbl { font-size:0.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
    .stat.ok .num { color:var(--green); }
    .stat.err .num { color:var(--red); }

    .card { background:var(--white); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-sm); overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:12px 16px; border-bottom:1px solid var(--border); background:#fafbfe; }
    td { padding:11px 16px; font-size:0.84rem; border-bottom:1px solid var(--border); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#fafbff; }

    .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 10px; border-radius:99px; font-size:0.72rem; font-weight:700; }
    .pill.success { background:var(--green-lt); color:var(--green); }
    .pill.error   { background:var(--red-lt);   color:var(--red); }
    .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

    .mono { font-variant-numeric:tabular-nums; }
    .err-text { color:var(--red); font-size:0.8rem; max-width:340px; word-break:break-word; }
    .log-link { color:var(--indigo); font-weight:600; text-decoration:none; font-size:0.8rem; }
    .log-link:hover { text-decoration:underline; }
    .muted { color:var(--muted); }
    .empty { padding:48px 20px; text-align:center; color:var(--muted); font-size:0.9rem; }
    .badge-unbal { background:var(--amber-lt); color:var(--amber); padding:1px 7px; border-radius:6px; font-size:0.7rem; font-weight:700; margin-left:6px; }

    .pager { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:16px 0 4px; }
    .pager-info { font-size:0.8rem; color:var(--sub); }
    .pager-controls { display:flex; align-items:center; gap:8px; }
    .pager-controls .page-ind { font-size:0.8rem; font-weight:600; color:var(--sub); min-width:120px; text-align:center; }
    .pager .field { flex-direction:row; align-items:center; gap:7px; }
    .pager .field label { text-transform:none; letter-spacing:0; }
    .btn:disabled { opacity:0.45; cursor:not-allowed; box-shadow:none; }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div>
      <a href="/" class="back-link">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16l-6-6 6-6"/></svg>
        Back to Dashboard
      </a>
      <h1>DSS Run History</h1>
      <p>Every Daily Sales Reconciliation run, per location. Re-runs append new records — old ones are kept.</p>
    </div>
  </div>
</div>

<div class="container">
  <div class="toolbar">
    <div class="field">
      <label for="fDate">Reconciliation date</label>
      <input type="date" id="fDate" />
    </div>
    <div class="field">
      <label for="fEst">Location</label>
      <select id="fEst"><option value="">All locations</option></select>
    </div>
    <button class="btn primary" onclick="applyFilters()">Apply</button>
    <button class="btn" onclick="clearFilters()">Clear</button>
    <button class="btn" onclick="load()" style="margin-left:auto;">↻ Refresh</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Run At (UTC)</th>
          <th>Location</th>
          <th>Recon Date</th>
          <th>Status</th>
          <th>JE Diff</th>
          <th>Attachment</th>
          <th>Details</th>
          <th>Log</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="8" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pager" id="pager" style="display:none;">
    <div class="pager-info" id="pagerInfo"></div>
    <div class="pager-controls">
      <div class="field">
        <label for="fPerPage">Per page</label>
        <select id="fPerPage">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
      <button class="btn" id="prevBtn" onclick="gotoPage(currentPage - 1)">← Prev</button>
      <span class="page-ind" id="pageInd"></span>
      <button class="btn" id="nextBtn" onclick="gotoPage(currentPage + 1)">Next →</button>
    </div>
  </div>
</div>

<script>
  let EST_NAMES = {};

  async function loadEstablishments() {
    try {
      const r = await fetch("/api/establishments");
      const j = await r.json();
      EST_NAMES = j.names || {};
      const sel = document.getElementById("fEst");
      Object.entries(EST_NAMES)
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, name]) => {
          const o = document.createElement("option");
          o.value = id; o.textContent = name;
          sel.appendChild(o);
        });
    } catch (e) { /* non-fatal */ }
  }

  let currentPage = 1;

  function perPage() {
    return parseInt(document.getElementById("fPerPage").value, 10) || 50;
  }

  // Filter/per-page changes reset to the first page; Refresh keeps the page.
  function applyFilters() { currentPage = 1; load(); }

  function gotoPage(p) {
    if (p < 1) return;
    currentPage = p;
    load();
  }

  function clearFilters() {
    document.getElementById("fDate").value = "";
    document.getElementById("fEst").value = "";
    currentPage = 1;
    load();
  }

  function esc(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  }

  async function load() {
    const date = document.getElementById("fDate").value;
    const est  = document.getElementById("fEst").value;
    const params = new URLSearchParams();
    if (date) params.set("date", date);
    if (est)  params.set("establishment_id", est);
    params.set("page", currentPage);
    params.set("per_page", perPage());

    const tbody = document.getElementById("rows");
    tbody.innerHTML = `<tr><td colspan="8" class="empty">Loading…</td></tr>`;
    document.getElementById("pager").style.display = "none";

    let j = {};
    try {
      const r = await fetch("/api/dss-runs?" + params.toString());
      j = await r.json();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">Failed to load: ${esc(e.message)}</td></tr>`;
      return;
    }
    const runs = j.runs || [];
    currentPage = j.page || 1;

    renderSummary(j);
    renderPager(j);

    if (!runs.length) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">No runs recorded yet${date || est ? " for this filter" : ""}.</td></tr>`;
      return;
    }

    tbody.innerHTML = runs.map(r => {
      const name = r.establishment_name || EST_NAMES[r.establishment_id] || ("est " + r.establishment_id);
      const ok = r.status === "success";
      const diff = (r.je_difference == null) ? "—" : Number(r.je_difference).toFixed(2);
      // An unbalanced JE is recorded as failed (status !== success) with je_balanced 0.
      const isUnbalanced = (r.je_balanced === 0 || r.je_balanced === false);
      const attach = r.attachment_status ? esc(r.attachment_status) : "—";
      const details = ok
        ? `<span class="muted">Posted</span>`
        : isUnbalanced
          ? `<span class="err-text">Unbalanced (${diff})</span>`
          : `<span class="err-text">${esc(r.error || "Error")}</span>`;
      const logCell = r.log_filename
        ? `<a class="log-link" href="/logs/${esc(r.log_filename)}" target="_blank">View</a>`
        : `<span class="muted">—</span>`;
      return `<tr>
        <td class="mono muted">${esc(r.created_at || "")}</td>
        <td><strong>${esc(name)}</strong></td>
        <td class="mono">${esc(r.run_date || "")}</td>
        <td><span class="pill ${ok ? "success" : "error"}"><span class="dot"></span>${ok ? "Success" : "Failed"}</span></td>
        <td class="mono">${diff}</td>
        <td>${attach}</td>
        <td>${details}</td>
        <td>${logCell}</td>
      </tr>`;
    }).join("");
  }

  function renderSummary(j) {
    // Counts come from the server and span ALL matching runs, not just this page.
    const total = j.total || 0;
    const ok = (j.counts && j.counts.success) || 0;
    const err = (j.counts && j.counts.failed) || 0;
    document.getElementById("summary").innerHTML = `
      <div class="stat"><div class="num">${total}</div><div class="lbl">Total Runs</div></div>
      <div class="stat ok"><div class="num">${ok}</div><div class="lbl">Success</div></div>
      <div class="stat err"><div class="num">${err}</div><div class="lbl">Failed</div></div>`;
  }

  function renderPager(j) {
    const pager = document.getElementById("pager");
    const total = j.total || 0;
    if (!total) { pager.style.display = "none"; return; }
    const page = j.page || 1;
    const pages = j.pages || 1;
    const per = j.per_page || perPage();
    const first = (page - 1) * per + 1;
    const last = Math.min(page * per, total);

    document.getElementById("pagerInfo").textContent =
      `Showing ${first}–${last} of ${total}`;
    document.getElementById("pageInd").textContent = `Page ${page} of ${pages}`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page >= pages;
    pager.style.display = "flex";
  }

  document.getElementById("fPerPage").addEventListener("change", applyFilters);

  loadEstablishments().then(load);
</script>
</body>
</html>
